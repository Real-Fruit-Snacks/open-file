name: Release

# Publishes a GitHub release for every version tag: the version's CHANGELOG.md section as the
# notes, a link to the live app (its URL is read from src/site.config.ts), the offline copy to
# download — the whole app with a launcher for Windows, macOS and Linux
# (scripts/package-offline.mjs, launcher/) — and the dev kit, the source with everything it
# installs, to work on it offline on Windows (scripts/build-dev-kit.mjs). The copy is built, then
# unzipped and tried in a browser as a learner gets it, and attached to a draft of the release;
# then the dev kit is built on Windows and tried offline as a developer gets it (dev-kit.yml), and
# only then is it attached and the release published.
on:
  push:
    tags: ['v*']
  # Publishes a tag's release again by hand (an attempt that failed, say), from the tag's code.
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish, such as v0.27.0
        required: true

permissions:
  contents: write

# One run per tag at a time; a second waits rather than cancelling a half-published release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build the offline copy and attach it to the release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Dependencies, every engine build and the human-like opponent's files (the copy carries
      # them all), and the browser the copy is tried in.
      - uses: ./.github/actions/setup
        with:
          engine: 'true'
          maia: 'true'
          browser: chromium

      # Fails unless package.json carries the tag's version and the changelog has its section.
      - name: Check the version and write the notes
        run: node scripts/release-notes.mjs --check "$TAG" > release-notes.md

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: launcher/go.mod
          # The launcher has no dependencies to cache.
          cache: false

      - name: Test the launcher
        working-directory: launcher
        run: |
          go vet ./...
          go test ./...

      - name: Build the app for the root of a site
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Package the offline copy
        run: npm run release:offline

      # The zip as a learner downloads it, unzipped and started with its own launcher.
      - name: Try the download
        run: |
          mkdir -p release/check
          unzip -q release/open-file-*-offline.zip -d release/check
          OFFLINE_BUNDLE="$(ls -d release/check/open-file-*)" npm run e2e:offline
        env:
          CI: 'true'

      # A new release stays a draft until the dev kit joins it (the dev-kit job). Published again,
      # a release keeps the other assets' checksums (the dev kit's) beside the copy's new one.
      - name: Attach the offline copy to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls release/open-file-*-offline.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern SHA256SUMS.txt --output - \
              | { grep -v -F "  $(basename "$zip")" || true; } >> release/SHA256SUMS.txt
            sort -k2 -o release/SHA256SUMS.txt release/SHA256SUMS.txt
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "$zip" release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$zip" release/SHA256SUMS.txt \
              --title "$TAG" --notes-file release-notes.md --verify-tag --draft
          fi

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-offline
          path: playwright-report/
          retention-days: 3

  # Built and tried on Windows, then attached; it publishes the release (dev-kit.yml).
  dev-kit:
    name: Dev kit
    needs: release
    uses: ./.github/workflows/dev-kit.yml
    permissions:
      contents: write
    with:
      ref: ${{ inputs.tag || github.ref }}
      release: ${{ inputs.tag || github.ref_name }}
