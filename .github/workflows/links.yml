name: Links

# The links in the Markdown (the README, the docs, the notices, the changelog), when it changes
# and monthly, because the pages they point at move without this repository changing.
on:
  push:
    branches: [main]
    paths: ['**.md', '.github/workflows/links.yml']
  schedule:
    - cron: '23 5 9 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check the links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Lichess's profile pages answer link checkers with 403, and gnu.org times out on requests
      # from GitHub's runners; the localhost and example addresses in the setup guides are not
      # meant to resolve.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429
            --exclude-all-private
            --exclude '^https://lichess\.org/@/'
            --exclude '^https://www\.gnu\.org/'
            --exclude 'example\.com|your-subdomain|(user|you)\.github\.io'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
