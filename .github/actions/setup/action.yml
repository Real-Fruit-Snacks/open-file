name: Set up the project
description: >-
  Node from .nvmrc and the locked dependencies (no install scripts), plus, when
  asked, the pinned engine binaries, the human-like opponent's files and one
  Playwright browser, each restored from a cache when it can be.

inputs:
  engine:
    description: >-
      Install the pinned Stockfish binaries into public/engine/: 'true' for every build (the
      full engine is about 200 MB), 'lite' for the two lite builds only, 'false' for none.
    default: 'false'
  maia:
    description: >-
      Install the human-like opponent's files into public/maia/ ('true' or 'false'): the pinned
      Maia-3 model (10.8 MB, from Hugging Face) and ONNX Runtime Web's WebAssembly build (copied
      from node_modules). Builds need them, and so does the unit test that runs the real model.
    default: 'false'
  browser:
    description: A Playwright browser to install (chromium, firefox or webkit); empty for none.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # No dependency needs an install script (fsevents, the only one with one, is
    # an optional macOS package), so none is allowed to run.
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    # The engine is downloaded from a pinned release and checksum-verified; the
    # cache only saves the download — engine:setup still checks every file.
    - name: Restore the engine binaries
      if: inputs.engine == 'true' || inputs.engine == 'lite'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          public/engine/*.js
          public/engine/*.wasm
        key: engine-${{ inputs.engine == 'lite' && 'lite-' || '' }}${{ hashFiles('scripts/setup-engine.mjs') }}

    - name: Install the engine
      if: inputs.engine == 'true' || inputs.engine == 'lite'
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
      run: |
        if [ "$ENGINE" = "lite" ]; then npm run engine:setup -- --lite; else npm run engine:setup; fi

    # Like the engine: the cache only saves the download, maia:setup checks the checksums.
    - name: Restore the human-like opponent's model
      if: inputs.maia == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: public/maia/*.onnx
        key: maia-${{ hashFiles('scripts/setup-maia.mjs') }}

    - name: Install the human-like opponent's files
      if: inputs.maia == 'true'
      shell: bash
      run: npm run maia:setup

    - name: Read the Playwright version
      if: inputs.browser != ''
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # The browser's system libraries come from Ubuntu's mirror: about 120 MB for WebKit. A slow
    # mirror once held two WebKit shards in this step past their 30 minutes, so apt keeps its
    # downloads where the cache can save them, and a later run downloads only the packages that
    # changed since (the package lists still come from the mirror, a few MB). The key follows
    # the runner image, which brings its own package versions.
    - name: Read the runner image
      if: inputs.browser != ''
      id: image
      shell: bash
      run: |
        echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Keep apt's downloads for the cache
      if: inputs.browser != ''
      shell: bash
      # Outside the home folder, which apt's download user (_apt) cannot enter.
      run: |
        dir=/var/cache/open-file-apt
        sudo mkdir -p "$dir/partial"
        sudo chown "$USER" "$dir"
        sudo chown _apt "$dir/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$dir/\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/90-open-file-cache > /dev/null

    - name: Restore the browser's system packages
      if: inputs.browser != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /var/cache/open-file-apt/*.deb
        key: apt-${{ steps.image.outputs.os }}-${{ inputs.browser }}-${{ steps.playwright.outputs.version }}-${{ steps.image.outputs.version }}
        restore-keys: |
          apt-${{ steps.image.outputs.os }}-${{ inputs.browser }}-

    - name: Restore the Playwright browser
      if: inputs.browser != ''
      id: browser-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ steps.playwright.outputs.version }}

    # Each install has 15 minutes (and a minute more to stop): one that stalls fails here, in time
    # to re-run, rather than taking the job's whole 30.
    - name: Install the Playwright browser
      if: inputs.browser != '' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: timeout -k 1m 15m npx playwright install --with-deps "$BROWSER"

    # The browser comes from its cache; its system libraries are installed from the packages above.
    - name: Install the browser's system libraries
      if: inputs.browser != '' && steps.browser-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: timeout -k 1m 15m npx playwright install-deps "$BROWSER"

    # Versions the mirror no longer has leave the cache, so it keeps one set rather than every set.
    - name: Drop superseded packages from the cache
      if: inputs.browser != ''
      shell: bash
      run: sudo apt-get autoclean -qq
