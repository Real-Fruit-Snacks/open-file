name: Set up the project
description: >-
  Node from .nvmrc and the locked dependencies (no install scripts), plus, when
  asked, the pinned engine binaries, the human-like opponent's files and one
  Playwright browser, each restored from a cache when it can be.

inputs:
  engine:
    description: >-
      Install the pinned Stockfish binaries into public/engine/: 'true' for every build (the
      full engine is about 200 MB), 'lite' for the two lite builds only, 'false' for none.
    default: 'false'
  maia:
    description: >-
      Install the human-like opponent's files into public/maia/ ('true' or 'false'): the pinned
      Maia-3 model (10.8 MB, from Hugging Face) and ONNX Runtime Web's WebAssembly build (copied
      from node_modules). Builds need them, and so does the unit test that runs the real model.
    default: 'false'
  browser:
    description: A Playwright browser to install (chromium, firefox or webkit); empty for none.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # No dependency needs an install script (fsevents, the only one with one, is
    # an optional macOS package), so none is allowed to run.
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    # The engine is downloaded from a pinned release and checksum-verified; the
    # cache only saves the download — engine:setup still checks every file.
    - name: Restore the engine binaries
      if: inputs.engine == 'true' || inputs.engine == 'lite'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          public/engine/*.js
          public/engine/*.wasm
        key: engine-${{ inputs.engine == 'lite' && 'lite-' || '' }}${{ hashFiles('scripts/setup-engine.mjs') }}

    - name: Install the engine
      if: inputs.engine == 'true' || inputs.engine == 'lite'
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
      run: |
        if [ "$ENGINE" = "lite" ]; then npm run engine:setup -- --lite; else npm run engine:setup; fi

    # Like the engine: the cache only saves the download, maia:setup checks the checksums.
    - name: Restore the human-like opponent's model
      if: inputs.maia == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: public/maia/*.onnx
        key: maia-${{ hashFiles('scripts/setup-maia.mjs') }}

    - name: Install the human-like opponent's files
      if: inputs.maia == 'true'
      shell: bash
      run: npm run maia:setup

    - name: Read the Playwright version
      if: inputs.browser != ''
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # The browser's system libraries come from Ubuntu: about 50 MB for Firefox, 120 MB for
    # WebKit. Azure's Ubuntu mirror, which the runners use, has more than once served them at a
    # crawl (a 9 MB package in three minutes), holding a shard past its time. So:
    # - apt keeps what it downloads, and the cache keeps that, even when the install fails, so
    #   a later run starts from it (named by what it holds, so an unchanged set is not saved again);
    # - a first attempt has 6 minutes; then Ubuntu's own archive is tried, for 12 more, with
    #   whatever the first attempt finished already in hand.
    - name: Read the runner image
      if: inputs.browser != ''
      id: image
      shell: bash
      run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Keep apt's downloads for the cache
      if: inputs.browser != ''
      shell: bash
      # Outside the home folder, which apt's download user (_apt) cannot enter.
      run: |
        dir=/var/cache/open-file-apt
        sudo mkdir -p "$dir/partial"
        sudo chown "$USER" "$dir"
        sudo chown _apt "$dir/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$dir/\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/90-open-file-cache > /dev/null

    - name: Restore the browser's system packages
      if: inputs.browser != ''
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /var/cache/open-file-apt/*.deb
        key: apt-${{ steps.image.outputs.os }}-${{ inputs.browser }}-
        restore-keys: |
          apt-${{ steps.image.outputs.os }}-${{ inputs.browser }}-

    - name: Install the browser's system libraries
      if: inputs.browser != ''
      id: deps
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        if timeout -k 30s 6m npx playwright install-deps "$BROWSER"; then exit 0; fi
        echo "::warning::Ubuntu's mirror is slow; trying Ubuntu's own archive."
        sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
          /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        timeout -k 30s 12m npx playwright install-deps "$BROWSER"

    # Versions Ubuntu no longer has leave the cache, so it keeps one set rather than every set;
    # then it is saved under a name made from the files it holds.
    - name: Name the browser's system packages
      if: always() && inputs.browser != ''
      id: apt-set
      shell: bash
      run: |
        sudo apt-get autoclean -qq || true
        set -- /var/cache/open-file-apt/*.deb
        if [ -e "$1" ]; then
          echo "hash=$(ls /var/cache/open-file-apt/*.deb | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the browser's system packages
      if: >-
        always() && inputs.browser != '' && steps.apt-set.outputs.hash != '' &&
        format('apt-{0}-{1}-{2}', steps.image.outputs.os, inputs.browser, steps.apt-set.outputs.hash)
        != steps.apt-cache.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /var/cache/open-file-apt/*.deb
        key: apt-${{ steps.image.outputs.os }}-${{ inputs.browser }}-${{ steps.apt-set.outputs.hash }}

    - name: Restore the Playwright browser
      if: inputs.browser != '' && steps.deps.outcome == 'success'
      id: browser-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ steps.playwright.outputs.version }}

    # The browser itself comes from Playwright's own download servers, which have been quick.
    - name: Install the Playwright browser
      if: inputs.browser != '' && steps.deps.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: timeout -k 30s 10m npx playwright install "$BROWSER"
