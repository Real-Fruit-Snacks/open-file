# Cover + social preview. Regenerate with Real-Fruit-Snacks/rfs-brand, from the folder holding both clones:
#   python3 rfs-brand/tools/make-cover.py open-file/docs/assets/cover.toml
# Layout v2 (BRAND.md section 7): name, rule, the README one-liner, and one panel.
name        = "open-file"
description = "Learn and play chess in your browser, offline"   # README line 1

# The forks lesson, cropped to the board: the knight on f6 checks the king on
# e8 and attacks the rook on d5. The whole app screen turns to mush on a 400px
# card; the board still reads. The shots are the app at 2x (960x736); the
# app's page is the brand bg, so "contain" sits the board on it seamlessly.
[panel]
kind = "screenshot"
file = "cover-shot-{theme}.png"
crop = [4, 182, 546, 532]       # x, y, width, height in the shot's pixels: rank and file labels included
fit  = "contain"
